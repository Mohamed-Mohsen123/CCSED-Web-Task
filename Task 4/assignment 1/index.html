<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Team Roster Table</title>
    <style>
      table {
        width: 1400px; /* wider */
        border: 3px solid #101820;
        border-collapse: collapse;
        font-family: Arial, Helvetica, sans-serif;
        margin: auto;
        background: white;
      }
      th {
        background: #2f79b8;
        color: white;
        padding: 32px; /* taller header */
        border: 1px solid #101820;
        font-size: 18px;
      }
      td {
        background: #d5e7f3;
        padding: 36px 24px; /* taller + wider cells */
        font-size: 18px; /* scale up text */
        border: 1px solid #cfcfcf;
      }
      .edit,
      .delete {
        color: #2f79b8;
        text-decoration: none;
        font-size: 13px;
      }
      .note {
        text-align: center;
        font-style: italic;
        color: #9b9b9b;
        background: white;
      }
      .link {
        color: #2f79b8;
      }
    </style>
  </head>
  <body
    style="
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px;
      background: white;
    "
  >
    <table>
      <tr>
        <th></th>
        <th>Team Name</th>
        <th>Start Date</th>
        <th>End Date</th>
        <th>Show on<br />Roster</th>
      </tr>

      <tr>
        <td><a class="edit" href="#">edit</a></td>
        <td>Terminator</td>
        <td>1/1/2003</td>
        <td>Ongoing</td>
        <td>yes &nbsp; <a class="delete" href="#">delete</a></td>
      </tr>

      <tr>
        <td><a class="edit" href="#">edit</a></td>
        <td>Fight Club</td>
        <td>24/10/2011</td>
        <td>18/01/2012</td>
        <td>no &nbsp; <a class="delete" href="#">delete</a></td>
      </tr>

      <tr>
        <td colspan="5" class="note">
          Not in a team between 12/08/2011 and 23/10/2011.
          <a class="link" href="#">Add to a Team</a>
        </td>
      </tr>

      <tr>
        <td><a class="edit" href="#">edit</a></td>
        <td>Team B</td>
        <td>1/01/2011</td>
        <td>11/08/2011</td>
        <td>yes &nbsp; <a class="delete" href="#">delete</a></td>
      </tr>

      <tr>
        <td colspan="5" class="note">
          <a class="link" href="#">Add to a team prior to 01/01/2011</a>
        </td>
      </tr>
    </table>
  </body>
</html>
